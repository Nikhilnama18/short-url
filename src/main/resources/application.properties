spring.application.name=shortURL
server.port=${PORT:8080}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Application Settings
app.host-url=${APP_HOST_URL:http://localhost:8080}
app.snowflake.machine-id=${APP_SNOWFLAKE_MACHINE_ID:1}

# PostgreSQL (Neon) Configuration
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/shorturl}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false